[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seminario-chatbot"
version = "0.1.0"
description = "Chatbot web de películas y videojuegos con PostgreSQL y LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "langchain-groq>=1.0,<2",
    "langgraph>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
catalog-chat = "seminario_chatbot.cli:main"
evaluate-chat-plans = "seminario_chatbot.evaluation.runner:main"
seminario-web = "seminario_chatbot.web.commands:run_web"
create-admin = "seminario_chatbot.web.commands:create_admin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seminario_chatbot = ["web/templates/*.html", "web/static/*.css"]
